server.port=8040
server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/astral?ssl=true&sslmode=verify-ca&sslcert=/etc/astral/certs/client-astral.crt&sslkey=/etc/astral/certs/client-astral.pk8&sslrootcert=/etc/astral/certs/root.crt
spring.datasource.username=astral
spring.datasource.driver-class-name=org.postgresql.Driver
# --- dono do schema (decisao do dono, 29/09) -------------------------------
# Este e o unico modulo do projeto com entidade JPA: 14 entidades que produzem
# exatamente as 16 tabelas do banco 'astral'. Portanto este e o dono do schema,
# e o Flyway assume. O outro modulo (astral-proxy) tem ZERO entidade, entao o
# ddl-auto dele e no-op e esta como 'none'.
#
# validate, e nao update: o Hibernate NAO pode mais criar nem alterar tabela.
# Se uma entidade divergir do que a V100 deixou, a aplicacao nao sobe -- e
# isso e o desejado, porque e o unico jeito de o banco divergente aparecer em
# vez de ser corrigido em silencio.
spring.jpa.hibernate.ddl-auto=validate

# baseline-on-migrate + baseline-version=1: no banco que ja existe (16 tabelas,
# sem historico) o Flyway registra a versao 1 como ja aplicada e NAO executa a
# V1 -- o estado real ja e o que a V1 descreve. Em banco novo, que comeca
# vazio, o baseline nao dispara e a V1 roda criando tudo. A divida entre o
# banco e o codigo e cobrada pelo validate acima, nao por confianca.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline do schema criado por ddl-auto=update ate 29/09/2026
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.thymeleaf.cache=false
