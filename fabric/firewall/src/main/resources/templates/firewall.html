<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><title>ASTRAL PLATFORM · FIREWALL</title>
<style>
@font-face{font-family:'Orbitron';src:url('/fonts/orbitron-bold.woff2') format('woff2');font-weight:700}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#05070d url('/images/Fundo.png') no-repeat center/cover fixed;color:#fff;font-family:'Segoe UI',sans-serif}
header{padding:20px 60px; display:flex; justify-content:space-between; align-items:center;}
header h1{margin:0;font-family:'Orbitron';font-weight:900;letter-spacing:.25em;font-size:26px;color:#eef5ff;text-shadow:0 0 8px #9fd8ff,0 0 24px #1668ff}
header .sub{font-family:'Orbitron';letter-spacing:.4em;color:#ff5c5c;font-size:12px;margin-top:6px}
.wrap{display:flex;gap:28px;padding:20px 60px;height:calc(100% - 130px)}
.side{width:270px;border:1px solid #ff5c5c;border-radius:14px;background:rgba(10,4,6,.8);display:flex;flex-direction:column;padding:18px}
.side .t{font-family:'Orbitron';letter-spacing:.25em;color:#ff8888;font-size:11px;margin-bottom:14px}
.nav button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:1px solid transparent;border-radius:10px;color:#ffd7d7;padding:11px 12px;font-size:14px;cursor:pointer;text-align:left}
.nav button .n{font-family:'Orbitron';color:#ff5c5c;font-size:11px}
.nav button.on{border-color:#ff5c5c;background:rgba(255,92,92,.12)}
.panic{margin-top:auto;background:linear-gradient(180deg,#ff5c5c,#c22);border:1px solid #ff8888;border-radius:10px;padding:12px;color:#fff;cursor:pointer;font-family:'Orbitron';letter-spacing:.15em}
.panic small{display:block;font-family:'Segoe UI';letter-spacing:0;opacity:.8}
.main{flex:1;overflow:auto}
.badge{float:right;border:1px solid #57e389;border-radius:20px;color:#b6ffd0;padding:6px 14px;font-size:12px}
h2{font-family:'Orbitron';letter-spacing:.2em;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:18px 0}
.card{border:1px solid #ff5c5c;border-radius:12px;background:rgba(10,4,6,.75);padding:16px}
.card .k{font-size:11px;letter-spacing:.15em;color:#ff9a9a}.card .v{font-family:'Orbitron';font-size:30px;margin:8px 0 4px}.card .s{font-size:11px;color:#888}
.v.amber{color:#ffb347}.v.green{color:#57e389}.v.white{color:#fff}
.panel{border:1px solid #ff5c5c;border-radius:12px;background:rgba(10,4,6,.75);padding:18px;margin-bottom:18px}
.panel h3{font-family:'Orbitron';letter-spacing:.15em;font-size:13px;color:#ff9a9a;margin:0 0 14px}
.bars{display:flex;gap:10px;align-items:flex-end;height:260px}
.bars .col{flex:1;display:flex;gap:4px;align-items:flex-end;height:100%}
.bars .a{background:linear-gradient(180deg,#57e389,#1d7a44);width:50%}.bars .b{background:linear-gradient(180deg,#ff5c5c,#8c1f1f);width:50%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#ff9a9a;text-align:left;letter-spacing:.1em;font-size:11px;border-bottom:1px solid #552222;padding:8px}
td{border-bottom:1px solid #331414;padding:8px}
.pill{border-radius:14px;padding:3px 12px;font-size:11px;font-family:'Orbitron'}
.pill.drop{background:#5a1414;border:1px solid #ff5c5c;color:#ffb3b3}.pill.accept{background:#0d3a22;border:1px solid #57e389;color:#b6ffd0}
button.act{background:#16324a;border:1px solid #3fa9ff;color:#cfe9ff;border-radius:6px;padding:5px 10px;cursor:pointer}
input,select{background:#0b0f14;border:1px solid #553;color:#fff;border-radius:6px;padding:7px;margin:3px}
#live{background:#000;color:#d7ffd7;font:12px/1.4 Consolas,monospace;height:300px;overflow:auto;padding:10px;white-space:pre-wrap}
.form-row{display:flex;gap:6px;align-items:center;background:#0b0f14;padding:10px;border-radius:6px;border:1px solid #334;flex-wrap:wrap}
.form-row input, .form-row select{flex:1}
</style></head>
<body>
<header>
  <div><h1>ASTRAL PLATFORM</h1><div class="sub">FIREWALL</div></div>
  <button class="act" style="padding:10px 20px;font-family:'Orbitron';letter-spacing:0.1em;" onclick="goHome()">🏠 VOLTAR AO INÍCIO</button>
</header>
<div class="wrap">
<aside class="side"><div class="t">MÓDULOS · FIREWALL</div><div class="nav" id="nav"></div>
<button class="panic" onclick="panic()">MODO PÂNICO<small>bloquear tudo, exceto admin</small></button></aside>
<main class="main"><span class="badge">● MOTOR ATIVO · iptables</span><h2 id="secTitle"></h2><div id="content"></div></main>
</div>
<script th:inline="none">
const SECS=[['dashboard','Dashboard'],['rules','Regras'],['nat','Port Forwarding'],['zones','Zonas'],['groups','Grupos'],['protections','Proteções'],['logs','Logs'],['backup','Backup & Auditoria']];
let cur='dashboard'; let uiData={ifaces:['any'], hostGroups:[], portGroups:[]};
async function loadUiData(){try{uiData=await api('/ui-data');}catch(e){}}
loadUiData().then(()=>{nav(); show('dashboard');});
function goHome() { window.location.href = '/inicio'; }
function formatBytes(b){let bytes=parseInt(b,10);if(isNaN(bytes)||bytes===0)return '0 B';const k=1024,sizes=['B','KB','MB','GB','TB'],i=Math.floor(Math.log(bytes)/Math.log(k));return parseFloat((bytes/Math.pow(k,i)).toFixed(2))+' '+sizes[i]}
function selIf(id, ph){return '<select id="'+id+'"><option value="">'+ph+'</option>'+uiData.ifaces.map(x=>'<option value="'+(x==='any'?'':x)+'">'+x+'</option>').join('')+'</select>'}
function inputOrGroupHost(id, ph) { let opts=uiData.hostGroups.map(g=>'<option value="'+g.name+'">[Grupo] '+g.name+'</option>').join(''); return '<input id="'+id+'" list="dl_'+id+'" placeholder="'+ph+'"><datalist id="dl_'+id+'">'+opts+'</datalist>'; }
function inputOrGroupPort(id, ph) { let opts=uiData.portGroups.map(g=>'<option value="'+g.name+'">[Grupo] '+g.name+'</option>').join(''); return '<input id="'+id+'" list="dl_'+id+'" placeholder="'+ph+'" style="max-width:140px"><datalist id="dl_'+id+'">'+opts+'</datalist>'; }
function nav(){document.getElementById('nav').innerHTML=SECS.map((s,i)=>'<button class="'+(s[0]===cur?'on':'')+'" data-s="'+s[0]+'" onclick="show(this.dataset.s)"><span class="n">0'+(i+1)+'</span>'+s[1]+'</button>').join('')}
async function api(p,o){try{const r=await fetch('/firewall/api'+p,Object.assign({headers:{'Content-Type':'application/json'}},o));let data=null;try{data=await r.json()}catch(e){}if(!r.ok){const msg=(data&&(data.error||data.message))||('HTTP '+r.status);alert('Erro em '+p+':\n\n'+msg);throw new Error(msg)}return data}catch(e){alert('Falha ao chamar '+p+':\n\n'+e.message);throw e}}
function panic(){if(!confirm('Ativar MODO PÂNICO?'))return;api('/panic',{method:'POST'}).then(()=>show('dashboard'))}
async function show(s){cur=s;if(window.liveTimer){clearInterval(window.liveTimer);window.liveTimer=null}nav();document.getElementById('secTitle').textContent=SECS.find(x=>x[0]===s)[1].toUpperCase();const c=document.getElementById('content');c.innerHTML='';
if(s==='dashboard'){const[st,sm]=await Promise.all([api('/status'),api('/stats')]);
c.innerHTML='<div class="cards"><div class="card"><div class="k">BLOQUEADOS (24H)</div><div class="v amber">'+sm.blocked24+'</div><div class="s">+'+sm.rejected24+' rejeitados</div></div><div class="card"><div class="k">PERMITIDOS (24H)</div><div class="v green">'+sm.accepted24+'</div><div class="s">tráfego normal</div></div><div class="card"><div class="k">REGRAS ATIVAS</div><div class="v white">'+st.rulesActive+'</div><div class="s">'+st.pending+' pendentes</div></div><div class="card"><div class="k">TENTATIVAS SSH</div><div class="v amber">'+sm.sshAttempts+'</div><div class="s">bloqueadas</div></div></div><div class="panel"><h3>TRÁFEGO — BLOQUEADO x PERMITIDO</h3><div class="bars">'+sm.series.map(b=>'<div class="col"><div class="a" style="height:'+Math.min(b.allowed/10,100)+'%"></div><div class="b" style="height:'+Math.min(b.blocked*3,100)+'%"></div></div>').join('')+'</div></div><div class="panel"><h3>TOP IPs BLOQUEADOS</h3><table><tr><th>ORIGEM</th><th>PORTA</th><th>AÇÃO</th></tr>'+sm.topBlocked.map(t=>'<tr><td>'+t.ip+'</td><td>'+t.port+'</td><td><span class="pill drop">'+t.action+'</span></td></tr>').join('')+'</table></div>'}
if(s==='rules'){const rs=await api('/rules');c.innerHTML='<div class="panel"><h3>REGRAS</h3><button class="act" onclick="api(&#39;/rules/apply&#39;,{method:&#39;POST&#39;}).then(()=>show(&#39;rules&#39;))">Atualizar Tela</button><table><tr><th>#</th><th>CHAIN</th><th>PROTO</th><th>PORTA / GRUPO</th><th>ORIGEM / GRUPO</th><th>DESTINO</th><th>AÇÃO</th><th>DADOS</th><th>STATUS</th><th></th></tr>'+rs.sort((a,b)=>a.priority-b.priority).map(r=>'<tr><td>'+r.priority+'</td><td>'+r.chain+'</td><td>'+r.protocol+'</td><td>'+r.port+'</td><td>'+(r.srcCidr||'any')+'</td><td>'+(r.dstCidr||'any')+'</td><td><span class="pill '+(r.action==='ACCEPT'?'accept':'drop')+'">'+r.action+'</span></td><td>'+formatBytes(r.bytes)+'</td><td>'+(r.appliedAt?'aplicada':'pendente')+'</td><td><button class="act" onclick="api(&#39;/rules/'+r.id+'&#39;,{method:&#39;DELETE&#39;}).then(()=>show(&#39;rules&#39;))">x</button></td></tr>').join('')+'</table><br><div class="form-row"><select id="rCh"><option>INPUT</option><option>FORWARD</option><option>OUTPUT</option></select><select id="rPr"><option>TCP</option><option>UDP</option><option>ALL</option></select>'+inputOrGroupPort('rPo','Porta ou Grupo') + inputOrGroupHost('rSr','Origem (IP/Grupo)') + inputOrGroupHost('rDs','Destino (IP/Grupo)')+'<select id="rAc"><option>ACCEPT</option><option>DROP</option><option>REJECT</option><option>LOG</option><option>QUEUE</option><option>RETURN</option></select><button class="act" onclick="addR()">+ Nova Regra</button></div></div>'}
if(s==='nat'){const[fs,ms]=await Promise.all([api('/forwards'),api('/masquerade')]);c.innerHTML='<div class="panel"><h3>PORT FORWARDING (DNAT)</h3><table><tr><th>IFACE WAN</th><th>EXTERNA</th><th>PROTO</th><th>INTERNO</th><th>DADOS</th><th></th></tr>'+fs.map(f=>'<tr><td>'+(f.iface||'any')+'</td><td>'+f.externalPort+'</td><td>'+f.protocol+'</td><td>'+f.internalIp+':'+f.internalPort+'</td><td>'+formatBytes(f.bytes)+'</td><td><button class="act" onclick="api(&#39;/forwards/'+f.id+'&#39;,{method:&#39;DELETE&#39;}).then(()=>show(&#39;nat&#39;))">x</button></td></tr>').join('')+'</table><br><div class="form-row">'+selIf('fi','WAN Iface')+'<select id="fpr"><option>TCP</option><option>UDP</option></select><input id="fe" placeholder="Porta Ext" style="max-width:80px"><input id="fip" placeholder="IP Interno"><input id="fpo" placeholder="Porta Int" style="max-width:80px"><button class="act" onclick="addF()">+ Forward</button></div></div><div class="panel"><h3>MASQUERADE (NAT de Saída / SNAT)</h3><table><tr><th>IFACE SAÍDA (WAN)</th><th>DADOS</th><th></th></tr>'+ms.map(m=>'<tr><td>'+(m.iface||'any')+'</td><td>'+formatBytes(m.bytes)+'</td><td><button class="act" onclick="api(&#39;/masquerade/'+m.id+'&#39;,{method:&#39;DELETE&#39;}).then(()=>show(&#39;nat&#39;))">x</button></td></tr>').join('')+'</table><br><div class="form-row">'+selIf('mi','WAN Iface')+'<button class="act" onclick="addM()">+ Masquerade</button></div></div>'}
if(s==='zones'){const z=await api('/zones');c.innerHTML='<div class="panel"><h3>ZONAS E REGRAS DIRECIONAIS</h3><table><tr><th>IP / REDE / NOME</th><th>TRUST</th><th>POLÍTICA (Ação)</th><th></th></tr>'+z.map(x=>'<tr><td>'+x.name+'</td><td>'+x.trustLevel+'</td><td>'+x.defaultPolicy+'</td><td><button class="act" onclick="api(&#39;/zones/'+x.id+'&#39;,{method:&#39;DELETE&#39;}).then(()=>show(&#39;zones&#39;))">x</button></td></tr>').join('')+'</table><br><div class="form-row"><input id="zn" placeholder="IP ou Rede (ex: 192.168.0.1)"><select id="zt"><option>WAN</option><option>LAN</option><option>DMZ</option></select><select id="zp"><option>DROP</option><option>ACCEPT</option><option>REJECT</option></select><button class="act" onclick="addZ()">+ Configurar Zona</button></div></div>'}
if(s==='groups'){const[h,p]=await Promise.all([api('/hostgroups'),api('/portgroups')]);c.innerHTML='<div class="panel"><h3>GRUPOS DE HOSTS</h3><table><tr><th>NOME DO GRUPO</th><th>IPs / CIDRs</th><th></th></tr>'+h.map(g=>'<tr><td>'+g.name+'</td><td>'+g.cidrs.join(', ')+'</td><td><button class="act" onclick="api(&#39;/hostgroups/'+g.id+'&#39;,{method:&#39;DELETE&#39;}).then(()=>show(&#39;groups&#39;))">x</button></td></tr>').join('')+'</table><br><div class="form-row"><input id="hn" placeholder="Nome do Grupo (sem espaços)"><input id="hc" placeholder="IPs ou CIDRs (separados por vírgula)"><button class="act" onclick="addHG()">+ Grupo de Hosts</button></div></div><div class="panel"><h3>GRUPOS DE PORTAS</h3><table><tr><th>NOME DO GRUPO</th><th>PORTAS</th><th></th></tr>'+p.map(g=>'<tr><td>'+g.name+'</td><td>'+g.ports.join(', ')+'</td><td><button class="act" onclick="api(&#39;/portgroups/'+g.id+'&#39;,{method:&#39;DELETE&#39;}).then(()=>show(&#39;groups&#39;))">x</button></td></tr>').join('')+'</table><br><div class="form-row"><input id="pn" placeholder="Nome do Grupo (sem espaços)"><input id="pc" placeholder="Portas (separadas por vírgula)"><button class="act" onclick="addPG()">+ Grupo de Portas</button></div></div>'}
if(s==='protections'){const[r,a,t]=await Promise.all([api('/ratelimits'),api('/autoban'),api('/threatlists')]);c.innerHTML='<div class="panel"><h3>RATE LIMIT</h3><table><tr><th>PORTA</th><th>PROTO</th><th>TAXA MÁXIMA</th><th></th></tr>'+r.map(x=>'<tr><td>'+x.port+'</td><td>'+x.protocol+'</td><td>'+x.ratePerSecond+'/seg</td><td><button class="act" onclick="api(&#39;/ratelimits/'+x.id+'&#39;,{method:&#39;DELETE&#39;}).then(()=>show(&#39;protections&#39;))">x</button></td></tr>').join('')+'</table><br><div class="form-row"><input id="rp" placeholder="Porta" style="max-width:80px"><select id="rpr"><option>TCP</option><option>UDP</option></select><input id="rr" placeholder="Taxa (ex: 20)" style="max-width:120px"><button class="act" onclick="addRL()">+ Rate Limit</button></div></div><div class="panel"><h3>AUTO-BAN (Proteção Anti-Bruteforce)</h3><table><tr><th>PORTA ALVO</th><th>TENTATIVAS</th><th>JANELA</th><th>TEMPO DE BAN</th><th></th></tr>'+a.map(x=>'<tr><td>'+x.targetPort+'</td><td>'+x.maxAttempts+'</td><td>'+x.windowMinutes+' min</td><td>'+x.banMinutes+' min</td><td><button class="act" onclick="api(&#39;/autoban/'+x.id+'&#39;,{method:&#39;DELETE&#39;}).then(()=>show(&#39;protections&#39;))">x</button></td></tr>').join('')+'</table><br><button class="act" onclick="api(&#39;/autoban&#39;,{method:&#39;POST&#39;,body:JSON.stringify({maxAttempts:5,windowMinutes:5,banMinutes:30,targetPort:&#39;22&#39;,enabled:true})}).then(()=>show(&#39;protections&#39;))">+ Auto-Ban Padrão SSH</button></div><div class="panel"><h3>BLOCKLISTS (Ameaças)</h3><p style="font-size:11px;color:#ff9a9a;margin-top:0;">A URL deve apontar para um arquivo .txt de texto puro contendo uma lista de IPs válidos.</p><table><tr><th>NOME</th><th>IPS BLOQUEADOS</th><th></th></tr>'+t.map(x=>'<tr><td>'+x.name+'</td><td>'+x.ipCount+'</td><td><button class="act" style="margin-right:6px;" onclick="api(&#39;/threatlists/'+x.id+'/refresh&#39;,{method:&#39;POST&#39;}).then(()=>show(&#39;protections&#39;))">Atualizar</button><button class="act" onclick="api(&#39;/threatlists/'+x.id+'&#39;,{method:&#39;DELETE&#39;}).then(()=>show(&#39;protections&#39;))">x</button></td></tr>').join('')+'</table><br><div class="form-row"><input id="tn" placeholder="Nome da Lista"><input id="tu" placeholder="URL do TXT de IPs (ex: https://dominio.com/ips.txt)"><button class="act" onclick="addTL()">+ Blocklist</button></div></div>'}
if(s==='logs'){c.innerHTML='<div class="panel"><h3>LOGS (tempo real)</h3><div id="live"></div><button class="act" onclick="location.href=&#39;/firewall/api/logs/export?format=csv&#39;">Exportar CSV</button></div>';window.liveTimer=setInterval(function(){api('/logs').then(function(l){var el=document.getElementById('live');if(el){el.textContent=l.map(function(x){return x.raw}).join('\n');el.scrollTop=el.scrollHeight}}).catch(function(){})},2000)}
if(s==='backup'){c.innerHTML='<div class="panel"><h3>BACKUP & RESTORE (BANCO)</h3><button class="act" onclick="downloadBk()">Exportar dump SQL</button> <input type="file" id="bkf"><button class="act" onclick="restoreBk()">Restaurar</button><h3>SNAPSHOTS</h3><div id="snaps"></div></div>';api('/snapshots').then(l=>snaps.innerHTML=l.map(x=>'<div>'+x.createdAt+' — '+x.label+' <button class="act" onclick="api(&#39;/snapshots/revert/'+x.id+'&#39;,{method:&#39;POST&#39;}).then(()=>show(&#39;backup&#39;))">reverter</button></div>').join(''))}
}
async function restoreBk(){const f=bkf.files[0];if(!f)return;const txt=await f.text();await api('/backup/restore',{method:'POST',headers:{'Content-Type':'text/plain'},body:txt});show('backup')}
async function downloadBk(){const r=await fetch('/firewall/api/backup');const t=await r.text();const b=new Blob([t],{type:'application/sql'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='astral_firewall_backup.sql';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);}
function addR(){const r={chain:document.getElementById('rCh').value,protocol:document.getElementById('rPr').value,port:document.getElementById('rPo').value,srcCidr:document.getElementById('rSr').value,dstCidr:document.getElementById('rDs').value,action:document.getElementById('rAc').value,enabled:true,comment:''};api('/rules',{method:'POST',body:JSON.stringify(r)}).then(res=>{if(res&&res.success===false)alert('Erro:\n'+(res.error||''));show('rules')})}
function addF(){api('/forwards',{method:'POST',body:JSON.stringify({iface:document.getElementById('fi').value,externalPort:document.getElementById('fe').value,protocol:document.getElementById('fpr').value,internalIp:document.getElementById('fip').value,internalPort:document.getElementById('fpo').value,enabled:true})}).then(()=>show('nat'))}
function addM(){api('/masquerade',{method:'POST',body:JSON.stringify({iface:document.getElementById('mi').value,enabled:true})}).then(()=>show('nat'))}
function addZ(){api('/zones',{method:'POST',body:JSON.stringify({name:document.getElementById('zn').value,trustLevel:document.getElementById('zt').value,defaultPolicy:document.getElementById('zp').value})}).then(()=>show('zones'))}
function addHG(){api('/hostgroups',{method:'POST',body:JSON.stringify({name:document.getElementById('hn').value,cidrs:document.getElementById('hc').value?document.getElementById('hc').value.split(',').map(s=>s.trim()):[]})}).then(()=>{loadUiData(); show('groups');})}
function addPG(){api('/portgroups',{method:'POST',body:JSON.stringify({name:document.getElementById('pn').value,ports:document.getElementById('pc').value?document.getElementById('pc').value.split(',').map(s=>s.trim()):[]})}).then(()=>{loadUiData(); show('groups');})}
function addRL(){api('/ratelimits',{method:'POST',body:JSON.stringify({port:document.getElementById('rp').value,protocol:document.getElementById('rpr').value,ratePerSecond:+document.getElementById('rr').value,enabled:true})}).then(()=>show('protections'))}
function addTL(){api('/threatlists',{method:'POST',body:JSON.stringify({name:document.getElementById('tn').value,sourceUrl:document.getElementById('tu').value,enabled:true})}).then(()=>show('protections'))}
</script></body></html>
