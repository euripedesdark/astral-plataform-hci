name: Astral build
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/main/resources/static/react/package.json
      - name: Build PrimeReact
        working-directory: src/main/resources/static/react
        run: npm install && npm run build
      - name: Build Spring Boot
        run: mvn -B -DskipTests package
