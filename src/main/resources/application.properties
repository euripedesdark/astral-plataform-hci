spring.application.name=astral-platform
server.port=8080
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# true = cookie so trafega por HTTPS. Fica false por padrao porque o ambiente de
# desenvolvimento e accessed em http:// e ligar isso aqui quebraria o login local.
# Quando estiver atras de TLS, suba ASTRAL_COOKIE_SECURE=true no /etc/astral/astral.env.
server.servlet.session.cookie.secure=${ASTRAL_COOKIE_SECURE:false}
server.servlet.session.timeout=8h
server.tomcat.threads.max=200
server.tomcat.accept-count=100
server.compression.enabled=true
spring.datasource.url=${ASTRAL_DB_URL:jdbc:postgresql://127.0.0.1:5432/astral}
spring.datasource.username=${ASTRAL_DB_USER:astral}
spring.datasource.password=${ASTRAL_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# O modulo agora e' o dono do schema: as entidades de fabric/ foram movidas para
# ca (firewall, network, proxy/acl, reconciliation). 'validate' confirma que o
# banco bate com o Java a cada subida e FALHA SE NAO BATER -- e' de proposito.
# 'none'/'update' deixam a divergencia aparecer como bug em producao, na hora
# menos conveniente. Quem cria coluna e' o Flyway, nunca o Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# O Flyway roda neste processo (a migracao standalone do astral-firewall foi
# desligada). O banco ja' nasceu populado pelo modulo antigo, entao o baseline
# marca o V1 como aplicado e a partir dai' toda mudanca e' uma migracao nova --
# proxima versao: V100__.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Virtual threads: o caminho quente do auth_request e' IO puro (Redis, banco,
# publisher). Thread platforma aqui so' gasta fd e cola o Tomcat em 200 conexoes.
spring.threads.virtual.enabled=true
astral.auth.postgres.enabled=${ASTRAL_AUTH_POSTGRES_ENABLED:true}
astral.auth.postgres.url=${ASTRAL_AUTH_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/astral}
astral.auth.postgres.admin-role=${ASTRAL_AUTH_POSTGRES_ADMIN_ROLE:astral_admin}
astral.auth.ad.enabled=${ASTRAL_AUTH_AD_ENABLED:true}
astral.auth.ad.domain=${ASTRAL_AD_DOMAIN:srvcloud.cloud}
# LDAPS por padrao: 636 com TLS ligado. Antes o default era ldap://...:389 com
# use-tls=false, ou seja, a senha do AD cruzava a rede em claro.
astral.auth.ad.url=${ASTRAL_AD_URL:ldaps://srvcloud.cloud:636}
astral.auth.ad.base-dn=${ASTRAL_AD_BASE_DN:DC=srvcloud,DC=cloud}
astral.auth.ad.admin-group=${ASTRAL_AD_ADMIN_GROUP:Domain Admins}
astral.auth.ad.use-tls=${ASTRAL_AD_USE_TLS:true}
astral.auth.ad.connect-timeout-ms=${ASTRAL_AD_TIMEOUT_MS:5000}
astral.proxy.auth.port=${ASTRAL_PROXY_AUTH_PORT:8091}
astral.firewall.url=${ASTRAL_FIREWALL_URL:http://127.0.0.1:8040}

# ---------------------------------------------------------------- Redis
# Cache do motor de ACL. Tempo de conexao curto de proposito: se o Redis cair,
# o fallback para PostgreSQL tem que acontecer em milissegundos, nao depois de
# um timeout de 5s por requisicao -- senao o auth_request inteiro fica lento.
spring.data.redis.host=${ASTRAL_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${ASTRAL_REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# ------------------------------------------------------------- RabbitMQ
# Fila da intencao -> reconciliacao. Com virtual threads o consumidor pode
# bloquear no shell do modulo sem prender nenhum request thread.
spring.rabbitmq.host=${ASTRAL_RABBIT_HOST:127.0.0.1}
spring.rabbitmq.port=${ASTRAL_RABBIT_PORT:5672}
spring.rabbitmq.username=${ASTRAL_RABBIT_USER:guest}
spring.rabbitmq.password=${ASTRAL_RABBIT_PASSWORD:guest}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.prefetch=8
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.connection-timeout=5s

# -------------------------------------------------------------- Graylog
# GELF/UDP escrito a mao em GraylogAuditPublisher; cai para JSONL se faltar.
astral.graylog.enabled=${ASTRAL_GRAYLOG_ENABLED:true}
astral.graylog.host=${ASTRAL_GRAYLOG_HOST:127.0.0.1}
astral.graylog.gelf-port=${ASTRAL_GRAYLOG_GELF_PORT:12201}
astral.graylog.queue-capacity=8192
astral.graylog.fallback-file=${ASTRAL_GRAYLOG_FALLBACK:/var/log/astral/graylog-fallback.jsonl}

# ------------------------------------------------------------------- ACL
# Fechado por padrao nos dois pontos em que o codigo pode escolher.
#   default-without-rule   -> ha categoria, mas nenhuma regra cobre o grupo
#   default-uncategorized  -> o dominio nem categoria tem
# BY_CATEGORY existe porque ha ambientes que querem "so' o que e' marcado como
# bloqueado por padrao e' negado"; e' escolha consciente, nao default.
astral.acl.default-without-rule=${ASTRAL_ACL_DEFAULT_WITHOUT_RULE:DENY}
astral.acl.default-uncategorized=${ASTRAL_ACL_DEFAULT_UNCATEGORIZED:ALLOW}
astral.acl.cache.enabled=true
astral.acl.cache.ttl-dominio=1h
astral.acl.cache.ttl-regra=5m
astral.acl.cache.ttl-decisao=15m
astral.acl.audit.enabled=true
# Caminhos que passam sem avaliacao -- espelham o permitAll do SecurityConfig.
# Sem login, assets e SPA publica, o auth_request exigiria identidade para chegar
# ao proprio login. Prefixo terminado em / casa com tudo dentro dele.
astral.acl.public-paths=${ASTRAL_ACL_PUBLIC_PATHS:/,/login,/home,/inicio,/app/,/assets/,/images/,/favicon.ico,/api/auth/login,/api/certs/ca/download,/error,/actuator/,/v3/api-docs/,/swagger-ui/}
# Indice do PASSO A: TTL curto porque excecao nova precisa valer rapido, mas
# TTL porque reconstruir a cada requisicao transformaria 2ms em consulta.
astral.acl.override-index-ttl=60000

# ------------------------------------------------------------------- JWT
# Desligado por padrao: o Auth Service de :8181 ainda nao emite token
# (docs/GUIA-INTEGRACAO-AUTH-SERVICE.md, secao 28) e validar um JWT que ninguem
# emite e' trabalho por nada. O caminho que funciona hoje e' a sessao do portal.
# Quando o Auth Service ganhar emissao, ligue com ASTRAL_AUTH_JWT_ENABLED=true
# e ASTRAL_AUTH_JWT_SECRET (>= 32 bytes, mesmo segredo dos dois lados).
astral.auth.jwt.enabled=${ASTRAL_AUTH_JWT_ENABLED:false}
astral.auth.jwt.secret=${ASTRAL_AUTH_JWT_SECRET:}

# Diretorio dos snapshots de rollback (ciclo Commit -> Rollback Obrigatorio).
# Vazio = ${java.io.tmpdir}/astral/rollback (padrao de RollbackStore).
# Atencao: com PrivateTmp=true no unit, o padrao e' da instancia -- se o
# snapshot precisa atravessar reinicio do servico, aponte para /var/lib/astral/rollback.
astral.reconciliation.rollback-dir=${ASTRAL_ROLLBACK_DIR:}

# --------------------------------------------------------------- OpenAPI
# springdoc alimenta o Swagger do front (Task 4): o form de enderecamento e a
# tela de ACL consomem /v3/api-docs, nao URLs decoradas a mao.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sort=alpha
springdoc.packages-to-scan=com.astral.fabric
springdoc.swagger-ui.tags-sort=alpha

management.endpoints.web.exposure.include=health,info,metrics
management.server.port=8081
management.server.address=127.0.0.1
